[project]
name = "rendezvous-bridge"
version = "0.1.0"
description = "Rendezvous venue-call bridge: Twilio media streams <-> Grok Voice via Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[xai,websocket,runner]==1.12.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "twilio>=9.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local mic mode (python -m bridge.dev_call). Needs `brew install portaudio` first.
local = ["pipecat-ai[local]==1.12.0"]
dev = ["pytest>=8"]

[project.scripts]
rendezvous-bridge = "bridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
