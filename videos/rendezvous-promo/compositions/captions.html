<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE flat cream block — single ink hairline border, square corners (coral's hard-edge
     geometry), ZERO radius, ZERO shadow */
  .caption-pill {
    max-width: 78%;
    padding: 18px 44px 20px;
    background: var(--cap-canvas, #f5f0e8);
    border: 1px solid var(--cap-ink, #1a1a1a);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.3em;
    font-family: "Big Shoulders", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(44px, 4.8vw, 64px);
    line-height: 1.04;
    letter-spacing: 0.06em;
  }

  /* upcoming — faint ink, no fill */
  .caption-word {
    display: inline-block;
    padding: 0 0.12em;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 40%, var(--cap-canvas, #f5f0e8));
  }
  /* current word — THE coral-fire flat block (box-shadow spread = a hard square block
     w/o layout shift; no blur, no radius), ink reading on top */
  .caption-word.is-active {
    color: var(--cap-ink, #1a1a1a);
    background: var(--cap-accent, #e85d5d);
    box-shadow: 0 0 0 0.1em var(--cap-accent, #e85d5d);
  }
  /* already spoken — solid ink, fill cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1a1a1a);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — a coral hairline underline (coral's only display inflection) */
  .caption-word.cap-brand {
    text-decoration: underline;
    text-decoration-thickness: 0.06em;
    text-decoration-color: var(--cap-accent, #e85d5d);
    text-underline-offset: 0.12em;
  }
  /* numerals / data — Inter body voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Atkinson Hyperlegible Next", ui-sans-serif, sans-serif;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 72%, var(--cap-canvas, #f5f0e8));
  }
  /* emphasis — a coral-dark hairline underline (the counter accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #d44a4a);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(38px, 5.8vw, 54px);
    }
  }
