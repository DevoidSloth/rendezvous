    <script>
      (function () {
        const ID = "02-just-text-it";
        const root = document.querySelector('[data-composition-id="' + ID + '"]');
        const $ = (s) => root.querySelector(s);
        const $$ = (s) => Array.from(root.querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });

        // ---------- build character spans (deterministic, synchronous) ----------
        function addChars(container, text, cls, color) {
          const out = [];
          let host = container;
          if (cls) {
            host = document.createElement("span");
            host.className = cls;
            if (color) host.style.color = color;
            container.appendChild(host);
          }
          for (const c of text) {
            const s = document.createElement("span");
            s.className = "jti-ch";
            s.textContent = c;
            host.appendChild(s);
            out.push(s);
          }
          return out;
        }

        // headline "Just text" / "it."
        const hChars = addChars($(".jti-hl1"), "Just text").concat(addChars($(".jti-hl2"), "it."));

        // composer text, three controlled lines
        const typed = $(".jti-typed");
        const caretT = document.createElement("span");
        // Scene 2 part
        const partA = addChars(typed, "dinner tonight, under $15");
        const br1 = document.createElement("br");
        br1.className = "jti-br";
        typed.appendChild(br1);
        const partA2 = addChars(typed, "each");
        // Scene 3 part
        const b1 = addChars(typed, ", with ");
        const maya = addChars(typed, "Maya", "jti-tname", "#f57a12");
        const b2 = addChars(typed, ", ");
        const dev = addChars(typed, "Dev", "jti-tname", "#8e3fd0");
        const br2 = document.createElement("br");
        br2.className = "jti-br";
        typed.appendChild(br2);
        const b3 = addChars(typed, "and ");
        const ana = addChars(typed, "Ana", "jti-tname", "#0d9a64");
        caretT.className = "jti-tcaret";
        typed.appendChild(caretT);

        // ---------- caret blink helper (finite, explicit sets) ----------
        function blink(el, start, end, half) {
          let on = true;
          for (let t = start; t < end; t += half) {
            tl.set(el, { opacity: on ? 1 : 0 }, t);
            on = !on;
          }
        }

        // initial states
        tl.set(caretT, { display: "none" }, 0);
        tl.set($(".jti-hcaret"), { display: "none" }, 0);
        tl.set($(".jti-hcaret"), { display: "inline-block" }, 0.31);

        // ---------- Scene 1 (0.00–0.445): phone lands, avatar pops, headline types ----------
        tl.fromTo(
          ".jti-phone",
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0
        );
        tl.fromTo(
          ".jti-avatar",
          { scale: 0.5 },
          { scale: 1, duration: 0.3, ease: "back.out(2.2)" },
          0.12
        );
        hChars.forEach((c, i) => tl.set(c, { display: "inline" }, 0.04 + i * 0.03));
        tl.set($(".jti-hcaret"), { display: "none" }, 0.46);
        // idle composer caret while focused
        blink($(".jti-icaret"), 0.1, 0.5, 0.2);

        // slow push-in on the phone, bottom-anchored (keeps keep-out clear)
        tl.fromTo(
          ".jti-cam",
          { scale: 1 },
          { scale: 1.025, duration: 2.5, ease: "sine.inOut" },
          0.45
        );

        // ---------- Scene 2 (0.445–1.78): "dinner tonight, under $15 each" ----------
        const T2 = 0.5;
        tl.set($(".jti-icaret"), { opacity: 0 }, T2);
        tl.set($(".jti-ph"), { opacity: 0 }, T2);
        tl.set(caretT, { display: "inline-block" }, T2);
        tl.set($(".jti-mic"), { opacity: 0 }, T2);
        tl.fromTo(
          ".jti-send",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2)" },
          T2
        );
        // the sender's own line starts as the ask begins
        tl.fromTo(
          ".jti-line-jason",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          T2
        );

        const s2 = partA.concat([br1], partA2);
        const s2Step = (1.7 - T2) / s2.length;
        s2.forEach((c, i) => {
          const t = T2 + i * s2Step;
          tl.set(c, { display: c === br1 ? "block" : "inline" }, t);
          if (c === br1) {
            tl.to(".jti-field", { height: 66, duration: 0.08, ease: "power2.out" }, t);
          }
        });

        // ---------- Scene 3 (1.78–2.37): ", with Maya, Dev and Ana" → send ----------
        const T3 = 1.79;
        const s3 = b1.concat(maya, b2, dev, [br2], b3, ana);
        const s3Step = (2.13 - T3) / s3.length;
        s3.forEach((c, i) => {
          const t = T3 + i * s3Step;
          tl.set(c, { display: c === br2 ? "block" : "inline" }, t);
          if (c === br2) {
            tl.to(".jti-field", { height: 90, duration: 0.07, ease: "power2.out" }, t);
          }
        });
        // each friend's line draws as their name lands
        const nameAt = (arr) => T3 + s3.indexOf(arr[0]) * s3Step;
        tl.fromTo(".jti-line-maya", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, nameAt(maya));
        tl.fromTo(".jti-line-dev", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, nameAt(dev));
        tl.fromTo(".jti-line-ana", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, nameAt(ana));

        // send press
        tl.to(".jti-send", { scale: 0.78, duration: 0.05, ease: "power2.in" }, 2.15);
        tl.to(".jti-send", { scale: 1, duration: 0.12, ease: "back.out(3)" }, 2.2);

        // composer clears, bubble lifts into the thread
        const TS = 2.22;
        tl.set(typed, { opacity: 0 }, TS);
        tl.set(".jti-field", { height: 42 }, TS);
        tl.set($(".jti-ph"), { opacity: 1 }, TS);
        tl.set(".jti-send", { opacity: 0 }, TS + 0.02);
        tl.set($(".jti-mic"), { opacity: 1 }, TS + 0.02);
        tl.fromTo(
          ".jti-sent",
          { y: 70, scale: 0.9, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
          TS
        );
        blink($(".jti-icaret"), TS + 0.04, 2.965, 0.22);

        // ---------- Scene 4 (2.37–2.965): reply pops, hold ----------
        const T4 = 2.44;
        tl.to(".jti-sent", { y: -73, duration: 0.18, ease: "power2.out" }, T4);
        tl.fromTo(
          ".jti-recv",
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.8)" },
          T4
        );
        // pad to the frame's exact length
        tl.set({}, {}, 2.965);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
