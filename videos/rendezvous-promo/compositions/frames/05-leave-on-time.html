    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Real voice duration 4.437s; packet windows (0–1 / 1–3 / 3–4s) scaled by 4.437/4.
        var S2 = 1.109; // clock starts at 6:15
        var S3 = 3.328; // clock hits 6:45 — arrival
        var CLOCK_SPAN = S3 - S2;
        function atMinute(m) {
          return S2 + ((m - 15) / 30) * CLOCK_SPAN;
        }

        var friends = [
          { id: "jason", leave: 15 },
          { id: "ana", leave: 28 },
          { id: "maya", leave: 34 },
          { id: "dev", leave: 38 }
        ];

        // Measure each route and hide it as one dash (svg-path-draw).
        friends.forEach(function (f) {
          var p = document.getElementById("r05-route-" + f.id);
          var len = p.getTotalLength();
          f.len = len;
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = len;
        });

        // ---- Scene 1 (0.0–1.109): the board assembles; Jason's text arrives ----
        tl.fromTo("#r05-axis", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
        tl.fromTo("#r05-tick-group line", { scaleY: 0 }, { scaleY: 1, duration: 0.3, stagger: 0.05, ease: "back.out(2)" }, 0.05);
        tl.fromTo("#r05-eyebrow, .r05-axis-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.05);
        tl.fromTo(".r05-guide, .r05-ghost", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
        // Every station part scales about the station's own center, not the SVG origin.
        gsap.set("#r05-pulse, #r05-station, #r05-core-idle, #r05-core", { svgOrigin: "1380 465" });
        [["jason", "200 300"], ["ana", "711 410"], ["maya", "947 520"], ["dev", "1105 630"]].forEach(function (d) {
          gsap.set("#r05-dot-" + d[0], { svgOrigin: d[1] });
        });
        tl.fromTo("#r05-station, #r05-core-idle", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.2);
        friends.forEach(function (f, i) {
          var t = 0.08 + i * 0.12;
          tl.fromTo("#r05-dot-" + f.id, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, t);
          tl.fromTo("#r05-label-" + f.id, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.04);
        });
        tl.fromTo("#r05-clock", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.15);
        tl.fromTo("#r05-playhead", { opacity: 0 }, { opacity: 0.18, duration: 0.3 }, 0.3);
        tl.set("#r05-pulse", { opacity: 0, scale: 1 }, 0);

        // iMessage banners: one per friend, each lands on that friend's leave time.
        var bannerAt = { jason: 0.3, ana: atMinute(28) - 0.12, maya: atMinute(34) - 0.12, dev: atMinute(38) - 0.12 };
        friends.forEach(function (f) {
          var b = "#r05-banner-" + f.id;
          tl.fromTo(b, { opacity: 0, y: -150, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: f.id === "jason" ? 0.5 : 0.32, ease: "power3.out" }, bannerAt[f.id]);
        });
        // Each new banner replaces the one before it, the way a phone stacks notifications.
        friends.forEach(function (f, i) {
          var next = friends[i + 1];
          if (!next) return;
          tl.to("#r05-banner-" + f.id, { opacity: 0, y: 24, scale: 0.96, duration: 0.2, ease: "power2.in" }, bannerAt[next.id]);
        });

        // ---- Scene 2 (1.109–3.328): clock runs 6:15 → 6:45, lines leave in order ----
        // The camera pans across the board toward the arrival station (spatial pan).
        tl.fromTo("#r05-world", { x: 40 }, { x: -100, duration: 2.5, ease: "power1.inOut" }, 0.95);
        // Playhead tracks the clock along the axis (200 → 1380px).
        tl.fromTo("#r05-playhead", { x: 0 }, { x: 1180, duration: CLOCK_SPAN, ease: "none", immediateRender: false }, S2);
        // Clock ticks minute by minute (discrete, seek-safe sets).
        var clockEl = document.getElementById("r05-clock-time");
        for (var m = 16; m <= 45; m++) {
          tl.set(clockEl, { textContent: "6:" + m }, atMinute(m));
        }
        // Each route self-draws from its own leave time; all finish together at 6:45.
        friends.forEach(function (f) {
          var start = atMinute(f.leave);
          tl.fromTo("#r05-route-" + f.id, { strokeDashoffset: f.len }, { strokeDashoffset: 0, duration: S3 - start, ease: "none" }, start);
          tl.to("#r05-dot-" + f.id, { scale: 1.35, duration: 0.12, ease: "power2.out" }, start);
          tl.to("#r05-dot-" + f.id, { scale: 1, duration: 0.25, ease: "power2.inOut" }, start + 0.12);
        });

        // ---- Scene 3 (3.328–4.437): everyone arrives; signal red; hold ----
        tl.fromTo("#r05-core", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, S3);
        tl.to("#r05-station", { scale: 1.14, duration: 0.14, ease: "power2.out" }, S3);
        tl.to("#r05-station", { scale: 1, duration: 0.35, ease: "power2.inOut" }, S3 + 0.14);
        tl.set("#r05-pulse", { opacity: 0.9 }, S3);
        tl.to("#r05-pulse", { opacity: 0, scale: 2.1, duration: 0.7, ease: "power2.out" }, S3 + 0.001);
        tl.set("#r05-clock", { color: "#E3262E" }, S3);
        tl.set("#r05-clock", { scale: 1.1 }, S3);
        tl.to("#r05-clock", { scale: 1, duration: 0.4, ease: "back.out(2)" }, S3 + 0.001);

        // Pin the timeline to the full frame length (static hold to the end).
        tl.set({}, {}, 4.437);

        window.__timelines["05-leave-on-time"] = tl;
      })();
