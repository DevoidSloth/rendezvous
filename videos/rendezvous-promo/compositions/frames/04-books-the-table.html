        if (t <= 1.85) return ring(t);
        var pt = 1.85, pa = ring(1.85);
        for (var k = 0; k < KEYS.length; k++) {
          if (t <= KEYS[k][0]) return pa + (KEYS[k][1] - pa) * ((t - pt) / (KEYS[k][0] - pt));
          pt = KEYS[k][0]; pa = KEYS[k][1];
        }
        return 0.04;
      }
      function applyWave(t) {
        var a = amp(t);
        for (var j = 0; j < bars.length; j++) {
          var s = 0.5 + 0.5 * Math.sin(t * 11 + j * 0.7) * Math.sin(t * 5.3 + j * 1.9);

          dots[d].style.transform = "translateY(" + (-4 * v).toFixed(2) + "px)";

      var clock = { t: 0 };

      tl.set($(".f04bt-typing"), { opacity: 0 }, 2.87);
