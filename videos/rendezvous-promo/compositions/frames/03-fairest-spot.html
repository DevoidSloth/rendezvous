    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ---- the one camera: world -> screen, transform-origin 0 0 ----
        // cam(s, wx, wy, sx, sy): put world point (wx,wy) at screen (sx,sy) at scale s
        function cam(s, wx, wy, sx, sy) {
          return { scale: s, x: sx - s * wx, y: sy - s * wy };
        }
        // path draw: real lengths measured once at setup (seek-safe, no pathLength scaling quirks)
        function prep(sel) {
          var el = document.querySelector(sel);
          var L = el.getTotalLength();
          el.style.strokeDasharray = L + " " + (L + 2);
          el.style.strokeDashoffset = L;
          return L;
        }
        var C0 = cam(1.04, 1000, 520, 960, 470);
        var C1 = cam(1.08, 1000, 520, 960, 470);
        var C2 = cam(1.16, 1080, 500, 960, 450);
        var C3 = cam(1.8, 1240, 700, 1180, 470);
        var C4 = cam(1.84, 1240, 700, 1180, 470);
        tl.fromTo("#fs03-world", C0, Object.assign({ duration: 1.9, ease: "sine.inOut" }, C1), 0);
        // leg 2: drift toward Collegetown while the routes draw
        tl.to("#fs03-world", Object.assign({ duration: 1.05, ease: "power2.inOut" }, C2), 1.9);
        // leg 3: landing push onto Sangam ("picks")
        tl.to("#fs03-world", Object.assign({ duration: 0.7, ease: "power4.out" }, C3), 2.95);
        // hold drift

        // ---- Scene 1: friends + checklist / "calendars" ----

          tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.1 + i * 0.1);
        });
        function tick(n, at) {
          tl.fromTo("#fs03-fill-" + n, { scale: 0 }, { scale: 1, duration: 0.18, ease: "power3.out" }, at);
          var L = prep("#fs03-tick-" + n);
          tl.fromTo("#fs03-tick-" + n, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, at + 0.08);
        }
        tick(1, 0.47);

        // ---- Scene 2: "budgets" + candidate pins ----
        tick(2, 1.17);
        tl.fromTo(".fs03-cand", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.06 }, 1.22);
        tl.fromTo("#fs03-st-ring", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 0.42, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, 1.25);

        // ---- Scene 3: "and every walk" - four routes self-draw, times land at each end ----
        var routes = [
          { n: 1, at: 1.92, d: 0.9 },
          { n: 4, at: 1.98, d: 0.78 },
          { n: 2, at: 2.06, d: 0.56 },
          { n: 3, at: 2.14, d: 0.46 }

        routes.forEach(function (r) {
          ["#fs03-cas-" + r.n, "#fs03-r-" + r.n].forEach(function (sel) {

            var L = prep(sel);

          });

        });
        tick(3, 2.36);

        // ---- Scene 4: "then picks the fairest spot" ----
        tl.to("#fs03-commons-lab", { opacity: 0, duration: 0.25, ease: "power2.out" }, 2.95);
        tl.to(".fs03-other", { opacity: 0.28, duration: 0.3, ease: "power2.out" }, 3.0);
        tl.to("#fs03-st-ring", { scale: 1, duration: 0.4, ease: "power3.out" }, 3.0);
        tl.fromTo("#fs03-st-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, 3.4);
        tl.fromTo("#fs03-card", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.45);
