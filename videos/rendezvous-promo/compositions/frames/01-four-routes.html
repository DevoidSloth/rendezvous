  <script>
    (function () {
      var FID = "01-four-routes";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var $ = function (name) {
        return root.querySelector('[id="' + FID + "-" + name + '"]');
      };

      // Duration is the real synced voice length; packet Scene windows (0–5.0s)
      // are scaled proportionally: S = 3.989 / 5.0.
      var DUR = 3.989;
      var S = DUR / 5.0;
      var T = function (s) {
        return s * S;
      };

      // Deterministic path sampler (M / L / Q only) so walker dots ride the drawn tip.
      function sampler(d) {
        var tok = d.match(/[MLQ]|-?\d*\.?\d+/g);
        var pts = [];
        var i = 0,
          cx = 0,
          cy = 0,
          cmd = "M";
        while (i < tok.length) {
          if (/[MLQ]/.test(tok[i])) cmd = tok[i++];
          if (cmd === "M" || cmd === "L") {
            var x = +tok[i++],
              y = +tok[i++];
            if (cmd === "L") {
              for (var k = 1; k <= 20; k++) pts.push([cx + ((x - cx) * k) / 20, cy + ((y - cy) * k) / 20]);
            } else pts.push([x, y]);
            cx = x;
            cy = y;
          } else if (cmd === "Q") {
            var qx = +tok[i++],
              qy = +tok[i++],
              ex = +tok[i++],
              ey = +tok[i++];
            for (var j = 1; j <= 24; j++) {
              var t = j / 24,
                u = 1 - t;
              pts.push([u * u * cx + 2 * u * t * qx + t * t * ex, u * u * cy + 2 * u * t * qy + t * t * ey]);
            }
            cx = ex;
            cy = ey;
          }
        }
        var acc = [0];
        for (var m = 1; m < pts.length; m++) {
          acc.push(acc[m - 1] + Math.hypot(pts[m][0] - pts[m - 1][0], pts[m][1] - pts[m - 1][1]));
        }
        var total = acc[acc.length - 1];
        return function (p) {
          var target = Math.max(0, Math.min(1, p)) * total;
          var lo = 1;
          while (lo < acc.length - 1 && acc[lo] < target) lo++;
          var seg = acc[lo] - acc[lo - 1] || 1;
          var f = (target - acc[lo - 1]) / seg;
          return [
            pts[lo - 1][0] + (pts[lo][0] - pts[lo - 1][0]) * f,
            pts[lo - 1][1] + (pts[lo][1] - pts[lo - 1][1]) * f,
          ];
        };
      }

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–1.2s packet): "Four friends." ----------
      // Clock, the display element, arrives first (hero visible well before 0.5s).
      var clock = $("clock");
      tl.fromTo(clock, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.0);
      tl.fromTo($("clock-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.12);

      // Origins pop in one per corner (spring-pop-entrance: power3.out, no overshoot).
      var order = ["jason", "maya", "dev", "ana"];
      order.forEach(function (n, i) {
        var at = 0.06 + i * 0.14;
        tl.fromTo(
          $("orig-" + n),
          { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          at,
        );
        tl.fromTo(
          $("lab-" + n),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
          at + 0.08,
        );
      });

      // The empty table waits at the center (no red yet), ghost routes faintly behind.
      tl.fromTo(
        $("station"),
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1.25, opacity: 1, duration: 0.4, ease: "power3.out" },
        T(0.75),
      );
      tl.fromTo($("ghosts"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, T(0.95));

      // ---------- Scene 2 (1.2–2.6s): "Four routes." lines self-draw ----------
      // Staggered starts (Jason first, Dev last); arrivals land one after another in Scene 3.
      var routes = {
        jason: { start: T(1.2), end: T(2.7) },
        ana: { start: T(1.4), end: T(3.0) },
        maya: { start: T(1.6), end: T(3.3) },
        dev: { start: T(1.8), end: T(3.6) },
      };
      Object.keys(routes).forEach(function (n, k) {
        var r = routes[n];
        var line = $("line-" + n);
        var walker = $("walk-" + n);
        var at = sampler(line.getAttribute("d"));
        var prog = { p: 0 };
        var apply = function () {
          line.style.strokeDashoffset = String(1 - prog.p);
          var pt = at(prog.p);
          walker.setAttribute("cx", pt[0].toFixed(2));
          walker.setAttribute("cy", pt[1].toFixed(2));
        };
        apply();
        tl.fromTo(
          prog,
          { p: 0 },
          { p: 1, duration: r.end - r.start, ease: "sine.inOut", onUpdate: apply, onComplete: apply },
          r.start,
        );
        tl.fromTo(
          walker,
          { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" },
          r.start,
        );
        // On arrival the station's ring tightens one notch.
        tl.fromTo(
          $("station"),
          { scale: 1.25 - k * 0.0625 },
          { scale: 1.25 - (k + 1) * 0.0625, duration: 0.2, ease: "power2.out", immediateRender: false },
          r.end,
        );
      });

      // Clock ticks forward with the walkers: 6:46 -> 7:15 (lands at Scene 4 start).
      var mins = { m: 46 };
      var renderClock = function () {
        var total = 6 * 60 + Math.round(mins.m);
        var h = Math.floor(total / 60);
        var mm = total % 60;
        clock.textContent = h + ":" + (mm < 10 ? "0" : "") + mm;
      };
      renderClock();
      tl.fromTo(
        mins,
        { m: 46 },
        { m: 75, duration: T(4.2) - T(1.2), ease: "power1.inOut", onUpdate: renderClock, onComplete: renderClock },
        T(1.2),
      );

      // ---------- Scene 3 (2.6–4.2s): "One table —" ----------
      var lastArrive = routes.dev.end;
      tl.fromTo(
        $("dot"),
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        lastArrive + 0.02,
      );
      // A single expanding ring off the arrival.
      tl.fromTo(
        $("pulse"),
        { scale: 0.7, opacity: 0.9, transformOrigin: "50% 50%" },
        { scale: 2.6, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
        lastArrive + 0.02,
      );

      // Gentle camera settle onto the table (scale about the station point).
      tl.fromTo(
        $("world"),
        { scale: 1 },
        { scale: 1.06, duration: DUR - T(2.6), ease: "power2.inOut" },
        T(2.6),
      );

      // ---------- Scene 4 (4.2–5.0s): "— at seven fifteen." ----------
      tl.fromTo(clock, { color: "#0e1b2c" }, { color: "#e3262e", duration: 0.18, ease: "power1.out" }, T(4.2));
      tl.fromTo($("clock-rule"), { backgroundColor: "#0e1b2c" }, { backgroundColor: "#e3262e", duration: 0.18, ease: "power1.out" }, T(4.2));
      tl.fromTo(
        $("venue"),
        { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" },
        T(4.2) + 0.04,
      );

      // Pad to the exact frame duration; the final state holds still.
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
