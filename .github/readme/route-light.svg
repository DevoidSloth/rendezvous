<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="How it works: mention, plan, approve, call, leave, split. A reply with a change sends the plan back, and venues that don't need a call skip it."><title>How Rendezvous works</title><style>@font-face{font-family:'BS';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AH';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'AH';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.bs{font-family:BS,'Arial Narrow',sans-serif;font-weight:800}.h{font-size:36px;fill:#0e1b2c}.n,.d,.b{font-family:AH,ui-sans-serif,system-ui,sans-serif}.n{font-size:13px;font-weight:700;letter-spacing:2px;fill:#4a5868}.d{font-size:15px;font-weight:500;fill:#4a5868}.b{font-size:14px;font-weight:700;fill:#4a5868}.seg path{fill:none;stroke-width:10;stroke-linecap:round}.br{fill:none;stroke:#4a5868;stroke-width:3.5;stroke-dasharray:.5 10;stroke-linecap:round}</style><rect width="1280" height="330" rx="22" fill="#eef1f4"/><path class="br" d="M357,208 C357,282 500,282 500,208"/><text x="428.5" y="300" text-anchor="middle" class="b">reply with a change</text><path class="br" d="M568,208 C568,282 922,282 922,208"/><text x="745.0" y="300" text-anchor="middle" class="b">no call needed</text><g class="seg"><path d="M112,196 L323,196" stroke="#2551e0"/><path d="M323,196 L534,196" stroke="#f57a12"/><path d="M534,196 L745,196" stroke="#8e3fd0"/><path d="M745,196 L956,196" stroke="#0d9a64"/><path d="M956,196 L1167,196" stroke="#e3262e"/></g><text x="112" y="56" text-anchor="middle" class="n">01</text><text x="112" y="98" text-anchor="middle" class="bs h">Mention</text><text x="112" y="128" text-anchor="middle" class="d">“@Rendezvous dinner</text><text x="112" y="148" text-anchor="middle" class="d">tonight, under $15”</text><circle cx="112" cy="196" r="13" fill="#eef1f4" stroke="#0e1b2c" stroke-width="6"/><text x="323" y="56" text-anchor="middle" class="n">02</text><text x="323" y="98" text-anchor="middle" class="bs h">Plan</text><text x="323" y="128" text-anchor="middle" class="d">Fairest walk for everyone,</text><text x="323" y="148" text-anchor="middle" class="d">inside every budget</text><circle cx="323" cy="196" r="13" fill="#eef1f4" stroke="#0e1b2c" stroke-width="6"/><text x="534" y="56" text-anchor="middle" class="n">03</text><text x="534" y="98" text-anchor="middle" class="bs h">Approve</text><text x="534" y="128" text-anchor="middle" class="d">A thumbs-up from each</text><text x="534" y="148" text-anchor="middle" class="d">person locks the plan</text><circle cx="534" cy="196" r="13" fill="#eef1f4" stroke="#0e1b2c" stroke-width="6"/><text x="745" y="56" text-anchor="middle" class="n">04</text><text x="745" y="98" text-anchor="middle" class="bs h">Call</text><text x="745" y="128" text-anchor="middle" class="d">Grok Voice phones the</text><text x="745" y="148" text-anchor="middle" class="d">venue and books it</text><circle cx="745" cy="196" r="13" fill="#eef1f4" stroke="#0e1b2c" stroke-width="6"/><text x="956" y="56" text-anchor="middle" class="n">05</text><text x="956" y="98" text-anchor="middle" class="bs h">Leave</text><text x="956" y="128" text-anchor="middle" class="d">Each person gets a DM</text><text x="956" y="148" text-anchor="middle" class="d">when it's time to go</text><circle cx="956" cy="196" r="13" fill="#eef1f4" stroke="#0e1b2c" stroke-width="6"/><text x="1167" y="56" text-anchor="middle" class="n">06</text><text x="1167" y="98" text-anchor="middle" class="bs h">Split</text><text x="1167" y="128" text-anchor="middle" class="d">Everyone confirms, and</text><text x="1167" y="148" text-anchor="middle" class="d">Nessie settles the bill</text><circle cx="1167" cy="196" r="21" fill="#0e1b2c"/><circle cx="1167" cy="196" r="14" fill="#eef1f4"/><circle cx="1167" cy="196" r="9" fill="#e3262e"/></svg>
